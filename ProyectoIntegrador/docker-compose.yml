services:
  gpu-service:
    build:
      context: ./gpu-service
      dockerfile: Dockerfile.cpu
    ports:
      - "8081:8080"
    environment:
      LOCAL_DATA_DIR: /data
      MAX_INPUT_VALUES: 2000000
    volumes:
      - ./runtime-data:/data

  # Este servicio local requiere spark-submit instalado en el host o una imagen Spark adaptada.
  # Se deja documentado en README como alternativa de desarrollo.
